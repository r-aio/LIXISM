name: LIXISM_s 3D Spherical BMC Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-lixism-3d:
    name: Bounded Model Checker (BMC) Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Make Script Executable
        run: chmod +x lixism_3d_bmc_verifier.py

      - name: Execute 3D Spherical BMC Verifier
        run: python lixism_3d_bmc_verifier.py --radius 9 --verbose
